 탭에 📜 내 전적이 생겼어요. 실시간 1대1과 🌐 랭킹전 결과가 상대 · 점수 · 레이팅 변화와 함께 쌓여요 (전체 / 실시간 / 랭킹전으로 나눠 보기 · 최근 60판)."},{v:"beta 4.1",d:"2026.09.29",tag:"개선",t:"🕹️ 버튼 배치 편집 수정",b:"설정 → 조작 설정에서 버튼 배치를 편집할 때 기술 · 스크린 버튼이 안 보이던 문제를 고쳤어요. 경기 화면 버튼과 아래 안내에 내가 바꾼 키가 그대로 표시돼요. 카드팩 명단에서 국기 아래가 잘리던 문제도 고쳤어요."},{v:"beta 4.0",d:"2026.09.29",tag:"신규",t:"💥 훕랜드급 모션 · 🧱 스크린 · 🏟 홈 코트",b:"덩크는 진짜로 날아올라 꽂고 림에 매달려요 (림이 흔들려요). 레이업 · 스핀무브 동작도 새로 만들었어요. 🧱 스크린: H 키나 스크린 버튼 → 동료가 와서 벽을 세워줘요. 기술 버튼은 누른 채 골대 쪽 = 스핀무브 · 뒤 = 비하인드 백(새 기술) · 위/아래 = 크로스오버 · 탭 = 스텝백 (키보드 I · Y · U · O). 구단마다 홈 코트가 달라요: 팀 색 · 마루 · 올린 로고가 센터 서클에 새겨져요."},{v:"beta 4.0",d:"2026.09.29",tag:"신규",t:"🃏 새 스페셜 카드 6장",b:"성찬 · 이강물 · 박이안 · 박성준 · 김태영 · 김운찬 스페셜 카드가 나왔어요! 고급 · 프리미엄 · 얼티밋 팩과 영입 시장에서 만날 수 있어요. 🏫 2-4반 팀컬러에 장유진 · 박이안 추가 (총 13명). 박태준 · 배대범은 PG · SG 두 포지션 모두 가능 (자동 선발 때 빈 자리에 들어가요)."},{v:"beta 4.0",d:"2026.09.29",tag:"개선",t:"🎮 1대1 순위 · 🧠 AI · ⏱ 쿼터 길이",b:"실시간 1대1 레이팅 순위 (온라인 탭 → 🎮 1대1 · 두 기기 결과가 같아야 반영 · 같은 상대는 하루 3판까지). AI가 더 똑똑해졌어요: 오픈 동료에게 빼주고, 속공 · 스크린 · 백도어 컷, 좋은 슈터는 바짝 막아요. 실시간 1대1 직접 조작은 방장이 쿼터 길이를 1분 · 2분 · 3분 중에 골라요 (리그 · 도전 · 온라인 직접 플레이는 2분 고정). AI도 쿼터가 끝나기 직전엔 버저비터를 던져요. 골대를 등지고는 슛이 안 나가고(먼저 돌아서요), 앞에 수비가 있으면 슛이 조금 어려워요. 슛 페이크는 직후에 잠깐 슛이 안 되고, 수비가 덜 속아요. 업적 진행도가 숫자로 보여요. 조작법이 🖥 컴퓨터 / 📱 모바일로 나뉘어서, 터치 기술 방향을 그림으로 볼 수 있어요. 오락실 슛 게이지는 초록칸에 걸치면 확실히 성공으로 판정돼요."},{v:"beta 3.1",d:"2026.09.29",tag:"신규",t:"🕹️ 오락실 · 🏀 코트 연습 · 👥 라이벌",b:"친선전 자리에 🕹️ 오락실이 생겼어요! 선수 한 명을 골라 ⏱ 60초 슈팅 · 🎯 3점 컨테스트 · 🧊 자유투 서든데스. PERFECT만 들어가고 인게임보다 훨씬 어려워요. 게임별 순위도 있어요. 🏀 코트 연습에서는 시간 · 샷클락 없이 기술 · 덩크 연습! 실시간 1대1 상대별 전적이 쌓이고 ⭐ 라이벌로 등록하면 라이벌전 승리 +50 토큰."},{v:"beta 3.1",d:"2026.09.29",tag:"개선",t:"🌀 기술 조작 · 🛡 보호권 · 편의 기능",b:"기술이 키마다 따로 나가요: I 스핀무브 · U 크로스오버 · O 스텝백(새 기술). 터치는 기술 버튼 탭 = 스핀 · 위/아래로 밀기 = 크로스오버 · 골대 반대쪽으로 밀기 = 스텝백. 우리 팀 선수 머리 위에 이름표. 영입 시장에서 🛡 강화 보호권 판매 (+5 이하 · +8 이하 · 하루 2장). 강화 연출이 새로워졌어요. 카드팩 5개 한 번에 열기, 로스터 🔋 체력 한눈에 + 지친 선수 벤치로, 폰 · 태블릿에서도 선수를 꾹 눌러 끌어서 교체. 🏫 2-4반 팀컬러에 이주환 · 소병준 추가, 서태환 포지션 PF로 변경. 설정에서 버튼 배치 편집이 안 되던 문제 수정."},{v:"beta 3.1",d:"2026.09.28",
