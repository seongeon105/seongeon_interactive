픽」 · 최대 +8 강화",b:"레어와 스페셜 사이 등급 에픽 추가 (레어 선수 15명의 상위 카드). 강화가 최대 +8까지! 대신 +4부터는 실패하면 절반 확률로 카드가 깨져서 +1~+3으로 떨어져요. +8은 능력치가 3씩 올라요."},{v:"beta 1.4",d:"2026.09.28",tag:"신규",t:"🔴 용산고 농구부 「바시티」 등급",b:"박태준 · 박범윤 · 박범진 · 배대범 합류! SC보다 높은 최고 등급이에요. 새 「얼티밋 팩」(10,000 토큰)에서만 나와요 — 스페셜 65% · 엘리트 30% · 바시티 5%. 영입 시장에는 나오지 않아요."},{v:"beta 1.4",d:"2026.09.28",tag:"신규",t:"🆕 신규 선수 이성원",b:"185cm · 125kg 센터. 몸싸움 장인 · 골밑과 리바운드가 강해요. 레어 등급으로 일반·고급 팩에서 나와요."},{v:"beta 1.4",d:"2026.09.28",tag:"신규",t:"💪 체력 · 경기력 · 경기 전 라인업",b:"선수마다 체력(뛴 만큼 줄고 라운드마다 회복)과 경기력(🔥▲■▼⬇, 활약에 따라 변함)이 생겼어요. 경기 시작 전에 라인업·전술을 확인하고 바꿀 수 있고, ⚡빠른 선발은 체력까지 고려해요. 로스터 자동 편성은 보관함 선수도 올려요."},{v:"beta 1.4",d:"2026.09.28",tag:"신규",t:"🔼 승격 선택 · 🔽 G리그 강등",b:"KBL 우승하면 G리그 승격과 KBL 잔류 중에서 골라요(G리그 우승 → NBA도 마찬가지). G리그 정규리그 하위 3팀은 KBL로 강등돼요. 순위표 빨간 줄이 강등권이에요."},{v:"beta 1.4",d:"2026.09.28",tag:"신규",t:"📋 일일 미션 9개 + 올클리어 보상",b:"매일 미션 9개. 모두 받으면 고급 팩 1장 무료! 업적 23개 추가(어려움 승리 · 덩크 · 스틸 · 엘리트 · 쌍둥이 · 강화 등)."},{v:"beta 1.4",d:"2026.09.28",tag:"밸런스",t:"💰 직접 플레이 난이도별 보상",b:"쉬움 ×0.7 · 보통 ×1 · 어려움 ×1.5. 정규리그 승리 150/패배 70 → 어려움 승리 225/패배 105. 경기 전 화면에 승리·패배 보상이 표시돼요."},{v:"beta 1.3",d:"2026.09.28",tag:"사운드",t:"🏟️ 경기장 사운드 업데이트",b:'관중 함성 · "디펜스!" 응원 · 오르간 응원가 · 쿼터·교체·작전타임 부저 · 파울 휘슬 추가. 설정에서 관중 함성·경기장 음악을 따로 조절할 수 있어요.'},{v:"beta 1.3",d:"2026.09.28",tag:"신규",t:"📰 게임 소식 · 인게임 뉴스",b:"홈 화면에서 업데이트 소식과 구단 뉴스를 한눈에 볼 수 있어요."},{v:"beta 1.2",d:"2026.09.28",tag:"신규",t:"🟣 새 등급 「엘리트」 출시",b:"스페셜과 SC 사이 등급. 이성언·다니엘·이윤관 등 17명. 신규 선수 루이스 합류 (다니엘과 같이 뛰면 쌍둥이 버프 +6%)."},{v:"beta 1.2",d:"2026.09.28",tag:"밸런스",t:"⚖️ 밸런스 패치",b:"KBL 팀 OVR 63~70 조정 · 프리미엄 팩 엘리트 11%·SC 7% · 중복 카드는 강화 재료로 · 30세 이후 전성기 보호 · 이성언 능력치 상향."},{v:"beta 1.2",d:"2026.09.28",tag:"편의",t:"🕹️ 조작 편의 업데이트",b:"조이스틱 끝까지 밀면 달리기 · 버튼 배치 편집(버튼별 크기) · 키 설정 · 아이패드 로스터·교체 탭 조작 · 교체 추천 선수 맨 앞 표시."},{v:"beta 1.1",d:"2026.09.27",tag:"신규",t:"🎮 직접 플레이 모드",b:"픽셀 5대5 직접 플레이 · 친선전 팀 코드 · G리그 실제 선수 · 강화 탭 · 설정 메뉴."}],s={"신규":"#FF8A1F","밸런스":"#4FB3E8","편의":"#5BC98B","사운드":"#C98BFF","버그":"#EF6A55"},n=t=>document.querySelec
