,{v:"beta 6.0",d:"2026.09.29",tag:"밸런스",t:"🎯 AI · 도전 모드 난이도",b:"직접 플레이 AI가 조금 더 강해졌어요 (슛 · 스틸 · 블록). 도전 모드 직접 플레이는 단계마다 어려워져요: 1~10단계 보통 · ~25단계 어려움 · ~40단계 🔥 지옥 · ~50단계 💀 전설. 에이스 한 명이 팀 슛을 몰아 쏘면 수비가 몰려서 성공률이 떨어져요. 팀으로 싸우세요!"},{v:"beta 6.0",d:"2026.09.29",tag:"개선",t:"🔋 체력 개편 · 🎯 미션 수정",b:'체력이 훨씬 덜 딸려요! 한 경기 풀타임 소모 36 → 26, 경기에 안 뛴 선수는 쉬면서 +8, 라운드마다 +30 회복, 그리고 게임을 꺼 둬도 10분마다 +3씩 자연 회복돼요. 미션: 도전 · 온라인 · 1대1 · 친선전도 이제 "경기 N번 하기 · 이기기 · 3점슛 · 10점 차 승리" 미션에 들어가요 (전에는 리그만 셌어요). 경기 포기는 미션에 안 들어가요.'},{v:"beta 6.0",d:"2026.09.29",tag:"개선",t:"🃏 우지우 합류 · 높은 등급 뽑아도 원래 카드 유지",b:"🆕 우지우 (173cm 가드) 노멀 · 레어 · 에픽 카드가 나왔어요! 가지고 있는 선수의 더 높은 등급 카드를 뽑으면, 원래 카드가 사라지지 않고 📦 보관함으로 가요 (강화 단계도 그대로!). 같은 선수는 로스터에 한 장만 들어가고, 보관함에서 다른 등급 카드를 올리면 자동으로 서로 자리를 바꿔요."},{v:"beta 5.9",d:"2026.09.29",tag:"신규",t:"😀 페이스온 5명 추가",b:"조형진 · 옥승원 · 황윤태 · 소병준 · 강준명 (👓 안경까지!) 이 실제 얼굴을 보고 만든 머리 모양 · 얼굴로 바뀌었어요. 홈 화면 무대 · 경기 · 오락실에서 볼 수 있어요."},{v:"beta 5.8",d:"2026.09.29",tag:"밸런스",t:"🏳️ 경기 포기 · 버그 수정",b:"직접 플레이 일시정지 메뉴에서 [감독 모드로 바꾸기] · [결과 보기]가 없어지고 [🏳️ 경기 포기]가 생겼어요. 포기하면 몰수패 (지고 있으면 그 점수, 아니면 0:20)이고 보상은 없어요. 도전 모드도 결과 보기가 없어요. 감독 모드에서 2x를 계속 누르면 경기가 더 빨라지던 버그, 직접 플레이 → 감독 모드로 바꾸면 2쿼터만 하던 버그를 고쳤어요. 카드 선수가 경기 · 시즌으로 자라는 건 OVR +6까지예요 (강화는 따로)."},{v:"beta 5.7",d:"2026.09.29",tag:"신규",t:"🃏 새 스페셜 카드 6장",b:"김건호 · 권하진 · 김현 · 장윤성 · 장일운 · 조성용 스페셜 카드가 나왔어요! 카드팩에서 뽑을 수 있어요."},{v:"beta 5.7",d:"2026.09.29",tag:"개선",t:"📱 디벗 화면 최적화",b:"아이패드(디벗) 화면에서 로스터 표가 옆으로 잘리던 걸 고쳤어요 (좁은 화면에선 키 · 특성 · 득점 칸을 숨기고, 선수 줄마다 ℹ️ 상세 버튼). 홈 화면 무대 애니메이션을 가볍게 해서 배터리 · 발열이 줄었어요."},{v:"beta 5.6",d:"2026.09.29",tag:"밸런스",t:"🎟 감독 모드 티켓",b:"감독 모드 하루 20판 제한이 없어지고, 대신 리그 경기를 📋 감독 모드로 하려면 🎟 티켓이 1장씩 필요해요. 티켓은 영입 시장에서 1장 25 토큰 (하루 50장까지 구매 · 최대 100장 보유). 모든 구단에 티켓 10장을 선물로 드려요! 🎮 직접 플레이 · 도전 · 온라인 · 1대1은 티켓 없이 그대로예요."},{v:"beta 5.5",d:"2026.09.29",tag:"편의",t:"🪪 선수 상세 정보 개편",b:"선수 상세 창을 새로 만들었어요. 위에 OVR · 키 · 국적 · 체력 · 경기력이 한눈에 보이고, 아래는 📊 능력치 (색깔 막대 · 강화로 오른 능력치는 ▲) · 시즌 기록 / 🎯 지침 · 특성 / ⚙ 관리 (강화 · 등번호 · 보관함 · 방출) 탭으로 나눴어요. 보관함 선수 옆에도 ℹ️ 상세 버튼이 생겼어요."},{v:"beta 5.4",d:"2026.09.29",tag:"수정",t:"👆 꾹 누르기 수정",b:"오락실 · 직접 플레이에서 슛하려고 화면을 꾹 누르면 아이패드의 복사 · 붙여넣기 / 선택 메뉴가 뜨던 문제를 고쳤어요."},{v:"beta 5.4",d:"2026.09.29",tag:"수정",t:"📱 로스터 · 미션 스크롤 수정",b:"아이패드(디벗) 가로 화면에서 미션 탭 업적이 안 보이고, 로스터 선수 표가 작은 칸에 끼어서 스크롤이 안 되던 문제를 고쳤어요. 이제 화면 전체가 위아래로 스크롤돼요. 선수를 길게 눌러 옮기는 건 0.4초 꾹 누르기로 바꿔서, 스크롤하다가 실수로 집히지 않아요."},{v:"beta 5.4",d:"2026.09.29",tag:"수정",t:"🎯 도전 · 온라인 미션 수정",b:'도전 모드 · 🌐 온라인 랭킹전 · 실시간 1대1을 해도 일일 미션 "도전 · 온라인 · 1대1 경기 1번"과 업적이 안 올라가던 문제를 고쳤어요. 이제 직접 플레이로 하면 "직접 플레이 1경기" 미션에도 들어가요.'},{v:"beta 5.4",d:"2026.09.29",tag:"편의",t:"🆕 자동 업데이트",b:"홈 화면 앱을 다시 열었을 때 옛날 버전이 그대로 뜨던 문제를 고쳤어요. 이제 게임이 알아서 새 버전을 확인해요. 타이틀 화면이면 바로 새 버전으로 바뀌고, 게임 중이면 위쪽에 [지금 업데이트] 알림이 떠요."},{v:"beta 5.3",d:"2026.09.29",tag:"편의",t:"🔄 직접 플레이 교체",b:"직접 플레이도 경기 전 라인업 화면에서 교체 수동 / 자동을 고를 수 있어요 (감독 모드 설정과 따로 저장돼요). 경기 중에는 화면 위쪽 🔄 교체 버튼을 누르면 바로 멈추고 교체 화면이 열려요."},{v:"beta 5.2",d:"2026.09.29",tag:"밸런스",t:"📋 감독 모드 하루 20판",b:"리그 경기 감독 모드는 이제 하루 20판까지만 할 수 있어요 (한국 시간 자정에 초기화). 경기 방식 고르는 화면에 오늘 남은 판 수가 나와요. 🎮 직접 플레이 · 도전 · 온라인 랭킹전 · 실시간 1대1 · 오락실은 그대로예요."},{v:"beta 5.1",d:"2026.09.29",tag:"신규",t:"🕹️ 오락실 보상 · 📅 오늘의 순위",b:"오락실에 보상이 생겼어요! 게임마다 하루 첫판 +30 토큰. 오락실 순위에 📅 오늘 탭이 생겼고, 게임별로 자정 기준 오늘 1~3위는 다음 날 게임에 들어오면 🥇 200 · 🥈 120 · 🥉 80 토큰을 받아요. 일일 미션에도 오락실 미션이 들어가요."},{v:"beta 5.0",d:"2026.09.29",tag:"신규",t:"👤 로그인 · ☁️ 클라우드 자동 백업",b:"이제 아이디 · 비밀번호로 가입하고 로그인할 수 있어요 (메일 인증 없음). 로그인하면 게임하는 동안 기록이 서버에 자동으로 저장돼서, 홈 화면 앱을 지우거나 기기를 바꿔도 같은 아이디로 로그인하면 그대로 이어할 수 있어요! 타이틀 화면이나 구단 탭 → 👤 계정에서 시작하세요. 가입하면 지금 기기의 온라인 레이팅도 그대로 이어져요."},{v:"beta 4.1",d:"2026.09.29",tag:"신규",t:"📜 내 전적",b:"온라인 탭에 📜 내 전적이 생겼어요. 실시간 1대1과 🌐 랭킹전 결과가 상대 · 점수 · 레이팅 변화와 함께 쌓여요 (전체 / 실시간 / 랭킹전으로 나눠 보기 · 최근 60판)."},{v:"beta 4.1",d:"2026.09.29",tag:"개선",t:"🕹️ 버튼 배치 편집 수정",b:"설정 → 조작 설정에서 버튼 배치를 편집할 때 기술 · 스크린 버튼이 안 보이던 문제를 고쳤어요. 경기 화면 버튼과 아래 안내에 내가 바꾼 키가 그대로 표시돼요. 카드팩 명단에서 국기 아래가 잘리던 문제도 고쳤어요."},{v:"beta 4.0",d:"2026.09.29",tag:"신규",t:"💥 새 덩크 · 레이업 모션 · 🧱 스크린 · 🏟 홈 코트",b:"덩크는 진짜로 날아올라 꽂고 림에 매달려요 (림이 흔들려요). 레이업 · 스핀무브 동작도 새로 만들었어요. 🧱 스크린: H 키나
